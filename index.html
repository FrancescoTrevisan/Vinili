<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La mia collezione</title>
<style>
  :root {
    --bg: #0A0A0A;
    --surface: #141414;
    --surface2: #1E1E1E;
    --surface3: #282828;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.15);
    --text: #FFFFFF;
    --text2: #A0A0A0;
    --text3: #606060;
    --accent: #FF4D4D;
    --accent2: #FF8080;
    --green: #1DB954;
    --radius: 8px;
    --radius-lg: 16px;
    --radius-xl: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  /* Header */
  .header { padding: 1.5rem 1.5rem 0; display: flex; align-items: center; justify-content: space-between; max-width: 1200px; margin: 0 auto; }
  .logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .header-right { display: flex; align-items: center; gap: 12px; }

  /* Stats bar */
  .stats-bar { max-width: 1200px; margin: 1.5rem auto 0; padding: 0 1.5rem; display: flex; gap: 2rem; }
  .stat-item { display: flex; flex-direction: column; gap: 2px; }
  .stat-num { font-size: 22px; font-weight: 700; }
  .stat-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }

  /* Search & filters */
  .controls { max-width: 1200px; margin: 1.5rem auto 0; padding: 0 1.5rem; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .search-wrap { position: relative; flex: 1; min-width: 200px; }
  .search-wrap input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 14px; padding: 10px 14px 10px 38px; }
  .search-wrap input:focus { outline: none; border-color: var(--border2); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 15px; pointer-events: none; }
  .filter-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 99px; padding: 6px 14px; font-size: 12px; color: var(--text2); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .chip:hover { border-color: var(--border2); color: var(--text); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: white; }

  /* Grid */
  .grid-wrap { max-width: 1200px; margin: 1.5rem auto; padding: 0 1.5rem; }
  .vinyl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
  @media(max-width: 480px) { .vinyl-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; } }

  /* Vinyl card */
  .vinyl-card { cursor: pointer; }
  .cover-wrap { position: relative; aspect-ratio: 1; border-radius: var(--radius); overflow: hidden; background: var(--surface2); margin-bottom: 10px; }
  .cover-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s ease; }
  .vinyl-card:hover .cover-wrap img { transform: scale(1.04); }
  .cover-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 48px; background: var(--surface3); }
  .cover-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; }
  .vinyl-card:hover .cover-overlay { opacity: 1; }
  .play-icon { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .card-title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-artist { font-size: 12px; color: var(--text2); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-meta { display: flex; align-items: center; justify-content: space-between; }
  .card-year { font-size: 11px; color: var(--text3); }
  .card-value { font-size: 12px; font-weight: 600; color: var(--green); }

  /* Buttons */
  .btn { font-family: inherit; font-size: 13px; padding: 9px 18px; border-radius: var(--radius); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; border: 1px solid; transition: all 0.15s; font-weight: 500; }
  .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn-primary:hover { opacity: 0.88; }
  .btn-ghost { background: transparent; color: var(--text2); border-color: var(--border2); }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .btn-icon { background: var(--surface2); color: var(--text2); border-color: var(--border); padding: 9px 12px; }
  .btn-icon:hover { background: var(--surface3); color: var(--text); }
  .btn-sm { font-size: 12px; padding: 6px 12px; }

  /* Modal overlay */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; display: flex; align-items: flex-end; justify-content: center; padding: 0; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  @media(min-width: 600px) { .modal-overlay { align-items: center; padding: 2rem; } }
  .modal { background: var(--surface); border-radius: var(--radius-xl) var(--radius-xl) 0 0; width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto; padding: 1.5rem; transform: translateY(40px); transition: transform 0.25s ease; }
  .modal-overlay.open .modal { transform: translateY(0); }
  @media(min-width: 600px) { .modal { border-radius: var(--radius-xl); } }

  /* Modal content */
  .modal-header { display: flex; gap: 1rem; margin-bottom: 1.25rem; }
  .modal-cover { width: 100px; height: 100px; border-radius: var(--radius); overflow: hidden; flex-shrink: 0; background: var(--surface2); }
  .modal-cover img { width: 100%; height: 100%; object-fit: cover; }
  .modal-cover-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 36px; }
  .modal-info { flex: 1; min-width: 0; }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
  .modal-artist { font-size: 14px; color: var(--text2); margin-bottom: 10px; }
  .modal-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { background: var(--surface3); border-radius: 6px; padding: 3px 10px; font-size: 11px; color: var(--text2); }
  .tag.green { background: rgba(29,185,84,0.15); color: var(--green); }
  .tag.red { background: rgba(255,77,77,0.15); color: var(--accent2); }
  .modal-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 1.25rem; }
  .modal-stat { background: var(--surface2); border-radius: var(--radius); padding: 12px; text-align: center; }
  .modal-stat-val { font-size: 18px; font-weight: 700; margin-bottom: 2px; }
  .modal-stat-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; }
  .section-title { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; margin-top: 1.25rem; }
  .tracklist { display: flex; flex-direction: column; gap: 2px; }
  .track { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: var(--radius); transition: background 0.15s; }
  .track:hover { background: var(--surface2); }
  .track-pos { font-size: 12px; color: var(--text3); width: 24px; text-align: center; flex-shrink: 0; }
  .track-title { font-size: 13px; flex: 1; }
  .track-dur { font-size: 12px; color: var(--text3); }
  .description { font-size: 13px; color: var(--text2); line-height: 1.7; background: var(--surface2); border-radius: var(--radius); padding: 14px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 1.25rem; flex-wrap: wrap; }
  .condition-select { background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text); font-size: 13px; padding: 8px 12px; font-family: inherit; }
  .notes-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 13px; padding: 10px 12px; font-family: inherit; resize: vertical; min-height: 72px; margin-top: 8px; }
  .notes-input:focus { outline: none; border-color: var(--border2); }

  /* Add panel */
  .add-panel { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .add-panel.open { opacity: 1; pointer-events: all; }
  .add-box { background: var(--surface); border-radius: var(--radius-xl) var(--radius-xl) 0 0; width: 100%; max-width: 520px; padding: 1.5rem; transform: translateY(40px); transition: transform 0.25s ease; }
  .add-panel.open .add-box { transform: translateY(0); }
  @media(min-width:600px){ .add-panel { align-items: center; } .add-box { border-radius: var(--radius-xl); } }
  .add-title { font-size: 17px; font-weight: 700; margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: space-between; }
  .add-methods { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1rem; }
  .add-method { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem; cursor: pointer; text-align: center; transition: all 0.15s; }
  .add-method:hover { border-color: var(--border2); background: var(--surface3); }
  .add-method.active { border-color: var(--accent); background: rgba(255,77,77,0.08); }
  .add-method-icon { font-size: 28px; margin-bottom: 6px; }
  .add-method-label { font-size: 13px; font-weight: 500; }
  .add-method-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .search-results { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; max-height: 300px; overflow-y: auto; }
  .result-item { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--surface2); border-radius: var(--radius); cursor: pointer; border: 1px solid transparent; transition: all 0.15s; }
  .result-item:hover { border-color: var(--accent); }
  .result-thumb { width: 44px; height: 44px; border-radius: 4px; object-fit: cover; background: var(--surface3); flex-shrink: 0; }
  .result-info { flex: 1; min-width: 0; }
  .result-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-sub { font-size: 11px; color: var(--text3); }
  .scan-area { background: var(--surface2); border: 2px dashed var(--border2); border-radius: var(--radius-lg); padding: 2rem; text-align: center; margin-top: 10px; }
  .scan-area p { font-size: 13px; color: var(--text2); margin-top: 8px; }
  video { width: 100%; border-radius: var(--radius); display: none; }
  video.active { display: block; }

  /* Toast */
  .toasts { position: fixed; top: 1.5rem; right: 1.5rem; z-index: 999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast { background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 10px 16px; font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 8px; animation: slideIn 0.2s ease; max-width: 280px; }
  .toast.success { border-left: 3px solid var(--green); }
  .toast.error { border-left: 3px solid var(--accent); }
  @keyframes slideIn { from{opacity:0;transform:translateX(16px)} to{opacity:1;transform:none} }

  /* Loading */
  .spinner { width: 16px; height: 16px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .loading-state { display: flex; align-items: center; gap: 10px; color: var(--text2); font-size: 13px; padding: 1rem 0; }

  .empty-state { text-align: center; padding: 5rem 2rem; color: var(--text3); }
  .empty-state .icon { font-size: 56px; margin-bottom: 1rem; }
  .empty-state h3 { font-size: 18px; color: var(--text2); margin-bottom: 8px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  .drag-handle { width: 36px; height: 4px; background: var(--surface3); border-radius: 2px; margin: 0 auto 1.25rem; }
  .close-btn { background: var(--surface2); border: none; color: var(--text2); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .close-btn:hover { background: var(--surface3); color: var(--text); }
</style>
</head>
<body>

<div class="toasts" id="toasts"></div>

<!-- Header -->
<div class="header">
  <div class="logo">■ <span>vinili</span></div>
  <div class="header-right">
    <button class="btn btn-icon" onclick="openExport()" title="Esporta">↓</button>
    <label class="btn btn-icon" style="cursor:pointer" title="Importa">↑<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label>
    <button class="btn btn-primary" onclick="openAdd()">+ Aggiungi</button>
  </div>
</div>

<!-- Stats -->
<div class="stats-bar" id="stats-bar"></div>

<!-- Controls -->
<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search-input" placeholder="Cerca artista, titolo…" oninput="renderGrid()">
  </div>
  <div class="filter-chips" id="genre-filters"></div>
</div>

<!-- Grid -->
<div class="grid-wrap">
  <div class="vinyl-grid" id="vinyl-grid"></div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-content"></div>
</div>

<!-- Add Panel -->
<div class="add-panel" id="add-panel" onclick="closeAdd(event)">
  <div class="add-box" id="add-box">
    <div class="drag-handle"></div>
    <div class="add-title">
      <span>Aggiungi disco</span>
      <button class="close-btn" onclick="closeAddPanel()">✕</button>
    </div>
    <div class="add-methods">
      <div class="add-method active" id="method-search" onclick="setMethod('search')">
        <div class="add-method-icon">🔍</div>
        <div class="add-method-label">Cerca</div>
        <div class="add-method-sub">Artista o titolo</div>
      </div>
      <div class="add-method" id="method-scan" onclick="setMethod('scan')">
        <div class="add-method-icon">📷</div>
        <div class="add-method-label">Scansiona</div>
        <div class="add-method-sub">Codice a barre</div>
      </div>
    </div>
    <div id="method-search-ui">
      <input type="text" id="add-search" placeholder="es. Kind of Blue, Miles Davis…"
        style="width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:14px;padding:10px 14px;font-family:inherit"
        oninput="searchDiscogs(this.value)">
      <div id="search-results"></div>
    </div>
    <div id="method-scan-ui" style="display:none">
      <div class="scan-area">
        <div style="font-size:36px">📷</div>
        <p>Inquadra il codice a barre del vinile</p>
        <video id="scanner-video" playsinline></video>
        <button class="btn btn-ghost" style="margin-top:12px" id="scan-btn" onclick="startScan()">Avvia fotocamera</button>
      </div>
      <div id="scan-results"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>
<script>
// ── Config ────────────────────────────────────────────────
const API_BASE = 'https://vinili-proxy.vercel.app'; // <-- aggiorna con il tuo URL Vercel dopo il deploy
const STORAGE_KEY = 'vinili_v1';

// ── State ─────────────────────────────────────────────────
let records = [];
let activeGenre = 'tutti';
let searchTimeout = null;
let codeReader = null;

// ── Storage ───────────────────────────────────────────────
function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); } catch(e){} }
function load() { try { const r = localStorage.getItem(STORAGE_KEY); if(r) records = JSON.parse(r); } catch(e){} }

// ── Export / Import ───────────────────────────────────────
function openExport() {
  const blob = new Blob([JSON.stringify(records, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'vinili_' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(a.href); toast('Collezione esportata', 'success');
}
function importData(e) {
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if(!Array.isArray(data)) throw new Error();
      const ids = new Set(records.map(r=>r.id));
      const nuovi = data.filter(r=>!ids.has(r.id));
      records = [...records, ...nuovi];
      save(); renderAll(); toast(`${nuovi.length} dischi importati`, 'success');
    } catch { toast('File non valido', 'error'); }
    e.target.value = '';
  };
  r.readAsText(file);
}

// ── Toast ─────────────────────────────────────────────────
function toast(msg, type='success') {
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div'); el.className = `toast ${type}`;
  el.textContent = msg; wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(()=>el.remove(),300); }, 3000);
}

// ── Render ────────────────────────────────────────────────
function renderStats() {
  const total = records.length;
  const value = records.reduce((s,r) => s + (r.marketValue || 0), 0);
  const genres = new Set(records.flatMap(r=>r.genres||[]));
  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-item"><div class="stat-num">${total}</div><div class="stat-label">Dischi</div></div>
    <div class="stat-item"><div class="stat-num" style="color:var(--green)">€${value.toLocaleString('it-IT',{maximumFractionDigits:0})}</div><div class="stat-label">Valore stimato</div></div>
    <div class="stat-item"><div class="stat-num">${genres.size}</div><div class="stat-label">Generi</div></div>`;
}

function renderFilters() {
  const allGenres = [...new Set(records.flatMap(r=>r.genres||[]))].sort();
  document.getElementById('genre-filters').innerHTML =
    ['tutti', ...allGenres].map(g =>
      `<button class="chip ${activeGenre===g?'active':''}" onclick="setGenre('${g}')">${g==='tutti'?'Tutti':g}</button>`
    ).join('');
}

function setGenre(g) { activeGenre = g; renderFilters(); renderGrid(); }

function renderGrid() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const list = records.filter(r => {
    const matchGenre = activeGenre === 'tutti' || (r.genres||[]).includes(activeGenre);
    const matchSearch = !q || r.title?.toLowerCase().includes(q) || r.artist?.toLowerCase().includes(q);
    return matchGenre && matchSearch;
  });
  const el = document.getElementById('vinyl-grid');
  if (!list.length) {
    el.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="icon">🎵</div>
      <h3>${records.length ? 'Nessun risultato' : 'Collezione vuota'}</h3>
      <p>${records.length ? 'Prova a cambiare filtri o ricerca' : 'Aggiungi il tuo primo disco con il pulsante in alto'}</p>
    </div>`;
    return;
  }
  el.innerHTML = list.map(r => `
    <div class="vinyl-card" onclick="openRecord('${r.id}')">
      <div class="cover-wrap">
        ${r.cover ? `<img src="${r.cover}" alt="${r.title}" loading="lazy">` : `<div class="cover-placeholder">🎵</div>`}
        <div class="cover-overlay"><div class="play-icon">▶</div></div>
      </div>
      <div class="card-title">${r.title || 'Titolo sconosciuto'}</div>
      <div class="card-artist">${r.artist || '—'}</div>
      <div class="card-meta">
        <span class="card-year">${r.year || '—'}</span>
        ${r.marketValue ? `<span class="card-value">€${r.marketValue}</span>` : ''}
      </div>
    </div>`).join('');
}

function renderAll() { renderStats(); renderFilters(); renderGrid(); }

// ── Detail modal ──────────────────────────────────────────
function openRecord(id) {
  const r = records.find(x=>x.id===id); if(!r) return;
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');

  const condOptions = ['', 'Mint (M)', 'Near Mint (NM)', 'Very Good Plus (VG+)', 'Very Good (VG)', 'Good Plus (G+)', 'Good (G)', 'Fair (F)', 'Poor (P)'];

  content.innerHTML = `
    <div class="drag-handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">
      <span style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em">Dettaglio</span>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" onclick="deleteRecord('${id}')">🗑 Elimina</button>
        <button class="close-btn" onclick="closeModalDirect()">✕</button>
      </div>
    </div>
    <div class="modal-header">
      <div class="modal-cover">
        ${r.cover ? `<img src="${r.cover}" alt="${r.title}">` : `<div class="modal-cover-placeholder">🎵</div>`}
      </div>
      <div class="modal-info">
        <div class="modal-title">${r.title || 'Titolo sconosciuto'}</div>
        <div class="modal-artist">${r.artist || '—'}</div>
        <div class="modal-tags">
          ${(r.genres||[]).map(g=>`<span class="tag">${g}</span>`).join('')}
          ${r.format ? `<span class="tag">${r.format}</span>` : ''}
          ${r.label ? `<span class="tag">${r.label}</span>` : ''}
        </div>
      </div>
    </div>
    <div class="modal-stats">
      <div class="modal-stat"><div class="modal-stat-val">${r.year || '—'}</div><div class="modal-stat-label">Anno</div></div>
      <div class="modal-stat"><div class="modal-stat-val" style="color:var(--green)">${r.marketValue ? '€'+r.marketValue : '—'}</div><div class="modal-stat-label">Valore</div></div>
      <div class="modal-stat"><div class="modal-stat-val">${r.condition || '—'}</div><div class="modal-stat-label">Condizione</div></div>
    </div>

    <div class="section-title">Condizione</div>
    <select class="condition-select" onchange="updateCondition('${id}', this.value)">
      ${condOptions.map(c=>`<option value="${c}" ${r.condition===c?'selected':''}>${c||'Non specificata'}</option>`).join('')}
    </select>

    ${r.tracklist?.length ? `
    <div class="section-title">Tracklist</div>
    <div class="tracklist">
      ${r.tracklist.map(t=>`
        <div class="track">
          <span class="track-pos">${t.position||'·'}</span>
          <span class="track-title">${t.title}</span>
          ${t.duration?`<span class="track-dur">${t.duration}</span>`:''}
        </div>`).join('')}
    </div>` : ''}

    ${r.description ? `
    <div class="section-title">Note</div>
    <div class="description">${r.description}</div>` : `
    <div class="section-title">Note AI</div>
    <div id="ai-desc-${id}">
      <button class="btn btn-ghost btn-sm" onclick="generateDescription('${id}')">✨ Genera descrizione</button>
    </div>`}

    <div class="section-title">Note personali</div>
    <textarea class="notes-input" placeholder="Dove l'hai trovato, ricordi…" onchange="updateNotes('${id}', this.value)">${r.notes||''}</textarea>
  `;
  overlay.classList.add('open');
}

function closeModal(e) { if(e.target === document.getElementById('modal-overlay')) closeModalDirect(); }
function closeModalDirect() { document.getElementById('modal-overlay').classList.remove('open'); }

function updateCondition(id, val) {
  const r = records.find(x=>x.id===id); if(r){ r.condition=val; save(); }
}
function updateNotes(id, val) {
  const r = records.find(x=>x.id===id); if(r){ r.notes=val; save(); }
}
function deleteRecord(id) {
  if(!confirm('Eliminare questo disco dalla collezione?')) return;
  records = records.filter(x=>x.id!==id);
  save(); renderAll(); closeModalDirect(); toast('Disco eliminato');
}

async function generateDescription(id) {
  const r = records.find(x=>x.id===id); if(!r) return;
  const el = document.getElementById(`ai-desc-${id}`); if(!el) return;
  el.innerHTML = '<div class="loading-state"><div class="spinner"></div> Generazione descrizione…</div>';
  try {
    const resp = await fetch(`${API_BASE}/api/claude`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ artist: r.artist, title: r.title, year: r.year, label: r.label, genres: r.genres, tracklist: r.tracklist })
    });
    const data = await resp.json();
    r.description = data.description;
    save();
    el.innerHTML = `<div class="description">${r.description}</div>`;
  } catch(e) { el.innerHTML = '<span style="color:var(--text3);font-size:13px">Errore nella generazione</span>'; }
}

// ── Add panel ─────────────────────────────────────────────
function openAdd() { document.getElementById('add-panel').classList.add('open'); }
function closeAdd(e) { if(e.target === document.getElementById('add-panel')) closeAddPanel(); }
function closeAddPanel() {
  document.getElementById('add-panel').classList.remove('open');
  stopScan();
  document.getElementById('add-search').value = '';
  document.getElementById('search-results').innerHTML = '';
  document.getElementById('scan-results').innerHTML = '';
  setMethod('search');
}

function setMethod(m) {
  document.getElementById('method-search').classList.toggle('active', m==='search');
  document.getElementById('method-scan').classList.toggle('active', m==='scan');
  document.getElementById('method-search-ui').style.display = m==='search'?'block':'none';
  document.getElementById('method-scan-ui').style.display = m==='scan'?'block':'none';
  if(m==='scan') startScan(); else stopScan();
}

// ── Discogs search ────────────────────────────────────────
function searchDiscogs(q) {
  clearTimeout(searchTimeout);
  if(q.length < 2) { document.getElementById('search-results').innerHTML=''; return; }
  searchTimeout = setTimeout(async () => {
    const el = document.getElementById('search-results');
    el.innerHTML = '<div class="loading-state"><div class="spinner"></div> Ricerca in corso…</div>';
    try {
      const r = await fetch(`${API_BASE}/api/discogs?query=${encodeURIComponent(q)}`);
      const data = await r.json();
      if(!data.results?.length){ el.innerHTML='<p style="color:var(--text3);font-size:13px;padding:8px">Nessun risultato</p>'; return; }
      el.innerHTML = '<div class="search-results">' + data.results.map(item => `
        <div class="result-item" onclick="selectResult(${item.id}, '${encodeURIComponent(JSON.stringify(item))}')">
          ${item.cover_image ? `<img class="result-thumb" src="${item.cover_image}" onerror="this.style.display='none'">` : '<div class="result-thumb" style="background:var(--surface3);display:flex;align-items:center;justify-content:center">🎵</div>'}
          <div class="result-info">
            <div class="result-title">${item.title}</div>
            <div class="result-sub">${item.year||''} ${item.label?'· '+item.label[0]:''} ${item.genre?'· '+item.genre[0]:''}</div>
          </div>
        </div>`).join('') + '</div>';
    } catch(e) { el.innerHTML = '<p style="color:var(--text3);font-size:13px;padding:8px">Errore nella ricerca</p>'; }
  }, 500);
}

async function selectResult(discogsId, itemJson) {
  const preview = JSON.parse(decodeURIComponent(itemJson));
  const el = document.getElementById('search-results');
  el.innerHTML = '<div class="loading-state"><div class="spinner"></div> Carico i dettagli…</div>';
  try {
    const r = await fetch(`${API_BASE}/api/discogs?releaseId=${discogsId}`);
    const data = await r.json();
    const record = buildRecord(data, preview);
    addRecord(record);
    closeAddPanel();
  } catch(e) {
    // Fallback con dati preview
    const record = buildRecord(null, preview);
    addRecord(record);
    closeAddPanel();
  }
}

function buildRecord(detail, preview) {
  const titleParts = (preview.title||'').split(' - ');
  const artist = titleParts.length > 1 ? titleParts[0] : (preview.artist||preview.title||'');
  const title = titleParts.length > 1 ? titleParts.slice(1).join(' - ') : (preview.title||'');

  let marketValue = null;
  const stats = detail?.market_stats || preview.market_stats;
  if (stats?.lowest_price?.value) marketValue = Math.round(stats.lowest_price.value);
  else if (stats?.median_price?.value) marketValue = Math.round(stats.median_price.value);

  return {
    id: Date.now().toString(),
    discogsId: preview.id || detail?.id,
    title: detail?.title || title,
    artist: detail?.artists?.[0]?.name || artist,
    year: detail?.year || preview.year,
    label: detail?.labels?.[0]?.name || (preview.label?.[0]),
    cover: detail?.images?.[0]?.uri || preview.cover_image,
    genres: detail?.genres || preview.genre || [],
    styles: detail?.styles || preview.style || [],
    format: detail?.formats?.[0]?.name || (preview.format?.[0]),
    tracklist: detail?.tracklist || [],
    marketValue,
    condition: '',
    notes: '',
    description: '',
    addedAt: new Date().toISOString()
  };
}

function addRecord(record) {
  records.unshift(record);
  save(); renderAll();
  toast(`${record.title} aggiunto alla collezione`, 'success');
}

// ── Barcode scanner ───────────────────────────────────────
async function startScan() {
  const video = document.getElementById('scanner-video');
  const btn = document.getElementById('scan-btn');
  btn.textContent = 'Scansione in corso…';
  btn.disabled = true;
  video.classList.add('active');
  try {
    const ZXing = window.ZXing;
    codeReader = new ZXing.BrowserBarcodeReader();
    await codeReader.decodeFromVideoDevice(null, 'scanner-video', async (result, err) => {
      if (result) {
        const barcode = result.getText();
        stopScan();
        const el = document.getElementById('scan-results');
        el.innerHTML = '<div class="loading-state"><div class="spinner"></div> Cerco su Discogs…</div>';
        try {
          const r = await fetch(`${API_BASE}/api/discogs?barcode=${barcode}`);
          const data = await r.json();
          if(data.results?.length) {
            el.innerHTML = '<div class="search-results">' + data.results.map(item => `
              <div class="result-item" onclick="selectResult(${item.id}, '${encodeURIComponent(JSON.stringify(item))}')">
                ${item.cover_image ? `<img class="result-thumb" src="${item.cover_image}">` : '<div class="result-thumb" style="background:var(--surface3)">🎵</div>'}
                <div class="result-info">
                  <div class="result-title">${item.title}</div>
                  <div class="result-sub">${item.year||''} ${item.label?'· '+item.label[0]:''}</div>
                </div>
              </div>`).join('') + '</div>';
          } else {
            el.innerHTML = '<p style="color:var(--text3);font-size:13px;padding:8px">Nessun risultato per questo barcode</p>';
          }
        } catch(e) { el.innerHTML = '<p style="color:var(--text3);font-size:13px;padding:8px">Errore nella ricerca</p>'; }
      }
    });
  } catch(e) {
    toast('Fotocamera non disponibile', 'error');
    stopScan();
  }
}

function stopScan() {
  if(codeReader) { try { codeReader.reset(); } catch(e){} codeReader = null; }
  const video = document.getElementById('scanner-video');
  if(video) video.classList.remove('active');
  const btn = document.getElementById('scan-btn');
  if(btn) { btn.textContent = 'Avvia fotocamera'; btn.disabled = false; }
}

// ── Init ──────────────────────────────────────────────────
load();
renderAll();
</script>
